<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>你是哪种水果人格？🍓</title>
<style>
  :root{
    --accent:#ff5f8f;
    --accent2:#ffb062;
    --light:#ffeef5;
    --ink:#42322d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:linear-gradient(155deg,#fff8ee 0%,#ffedf3 42%,#eef5ff 100%);
    min-height:100vh;
    overflow-x:hidden;
  }

  /* 背景漂浮水果 */
  .bg-decor{position:fixed;inset:0;z-index:0;overflow:hidden}
  .bg-decor span{
    position:absolute;opacity:.16;user-select:none;
    animation:drift 10s ease-in-out infinite;
  }
  @keyframes drift{
    0%,100%{transform:translateY(0) rotate(-10deg) scale(1)}
    50%{transform:translateY(-34px) rotate(10deg) scale(1.08)}
  }

  .app{
    position:relative;z-index:1;
    max-width:540px;margin:0 auto;
    padding:clamp(20px,5vh,48px) 18px 40px;
  }
  .brand{
    text-align:center;font-size:13px;font-weight:700;
    letter-spacing:2px;color:#c98aa0;margin-bottom:16px;
  }
  .card{
    background:rgba(255,255,255,.82);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:30px;
    padding:clamp(26px,6vw,42px) 24px;
    box-shadow:0 24px 60px -18px rgba(255,110,150,.35);
    border:1.5px solid rgba(255,255,255,.85);
  }
  .screen{display:none}
  .screen.active{display:block;animation:screenIn .5s cubic-bezier(.2,.8,.2,1)}
  @keyframes screenIn{
    from{opacity:0;transform:translateY(18px) scale(.98)}
    to{opacity:1;transform:none}
  }

  /* ===== 开始页 ===== */
  .hero-fruits{
    display:flex;flex-wrap:wrap;justify-content:center;gap:6px;
    font-size:46px;margin:6px 0 18px;
  }
  .hero-fruits span{display:inline-block;animation:bob 2.6s ease-in-out infinite}
  .hero-fruits span:nth-child(2n){animation-delay:.3s}
  .hero-fruits span:nth-child(3n){animation-delay:.6s}
  .hero-fruits span:nth-child(4n){animation-delay:.9s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px) rotate(6deg)}}
  .start-title{
    text-align:center;font-size:clamp(26px,7vw,34px);font-weight:900;
    line-height:1.3;margin:0 0 12px;
    background:linear-gradient(120deg,#ff4d7e,#ff9a3c 60%,#8e5bb5);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .start-sub{
    text-align:center;font-size:15px;line-height:1.9;color:#8a736b;margin:0 0 28px;
  }
  .start-sub b{color:#ff5f8f}
  .btn{
    display:block;width:100%;border:none;cursor:pointer;
    font-family:inherit;font-weight:800;letter-spacing:1px;
    border-radius:999px;padding:17px 24px;font-size:17px;
    color:#fff;background:linear-gradient(120deg,var(--accent),var(--accent2));
    box-shadow:0 12px 28px -8px var(--accent);
    transition:transform .2s,box-shadow .2s;
  }
  .btn:active{transform:scale(.97)}
  .btn:hover{transform:translateY(-2px);box-shadow:0 16px 34px -8px var(--accent)}
  .btn.ghost{
    background:#fff;color:var(--accent);
    border:2px solid var(--accent);box-shadow:none;margin-top:12px;
  }
  .footnote{text-align:center;margin-top:22px;font-size:12px;color:#b8a29b}

  /* ===== 答题页 ===== */
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .back{
    border:none;background:none;font-family:inherit;font-size:13px;
    color:#b08a95;cursor:pointer;padding:4px 8px;font-weight:700;
  }
  .back[hidden]{visibility:hidden}
  .progress{flex:1;height:10px;background:#fde9f0;border-radius:999px;overflow:hidden}
  .progress-fill{
    height:100%;width:0%;border-radius:999px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width .45s cubic-bezier(.2,.8,.2,1);
  }
  .counter{font-size:13px;font-weight:800;color:var(--accent);letter-spacing:1px;margin-bottom:10px}
  .question{
    font-size:clamp(19px,5vw,23px);font-weight:900;line-height:1.5;
    margin:0 0 20px;
  }
  .options.locked{pointer-events:none}
  .option{
    display:flex;align-items:center;gap:12px;width:100%;
    text-align:left;font-family:inherit;font-size:15.5px;line-height:1.5;
    color:var(--ink);cursor:pointer;
    background:#fff;border:2px solid #f6e3ea;border-radius:18px;
    padding:15px 16px;margin:10px 0;
    animation:optIn .5s both;
    transition:transform .18s,border-color .18s,background .18s,box-shadow .18s;
  }
  .option:hover{border-color:var(--accent);transform:translateX(4px)}
  .option.picked{
    border-color:var(--accent);background:var(--light);
    box-shadow:0 8px 22px -10px var(--accent);transform:scale(1.02);
  }
  @keyframes optIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .badge{
    flex:none;width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:900;color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
  }

  /* ===== 结果页 ===== */
  .result-head{text-align:center}
  .fruit-big{
    font-size:96px;line-height:1;margin:4px 0 10px;
    display:inline-block;animation:fruitPop .7s cubic-bezier(.2,1.4,.4,1), bob 2.6s ease-in-out .7s infinite;
  }
  @keyframes fruitPop{
    0%{transform:scale(0) rotate(-40deg);opacity:0}
    70%{transform:scale(1.2) rotate(8deg)}
    100%{transform:scale(1) rotate(0);opacity:1}
  }
  .r-tag{font-size:13px;letter-spacing:3px;color:#a98;font-weight:700}
  .r-name{
    font-size:38px;font-weight:900;margin:4px 0 2px;
    color:var(--accent);
  }
  .r-title{font-size:17px;font-weight:800;color:#6b5750}
  .r-fit{
    display:inline-block;margin-top:14px;padding:7px 18px;
    border-radius:999px;font-size:14px;font-weight:800;
    color:var(--accent);background:var(--light);
  }
  .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:20px 0 18px}
  .chip{
    font-size:13px;font-weight:700;padding:6px 14px;border-radius:999px;
    color:var(--accent);background:var(--light);border:1px solid var(--accent);
  }
  .r-desc{
    font-size:15px;line-height:1.95;margin:0 0 22px;
    background:#fffaf6;border-radius:18px;padding:16px 18px;color:#6d5b54;
  }
  .compose h4,.match-box h4{font-size:14px;margin:0 0 12px;color:#9a847c;letter-spacing:1px}
  .bar-row{display:flex;align-items:center;gap:10px;margin:9px 0}
  .bar-label{width:76px;flex:none;font-size:13.5px;font-weight:700}
  .bar-track{flex:1;height:12px;background:#f3e9e8;border-radius:999px;overflow:hidden}
  .bar-fill{
    height:100%;border-radius:999px;width:0;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width .9s cubic-bezier(.2,.8,.2,1);
  }
  .bar-val{width:18px;flex:none;text-align:right;font-size:12px;font-weight:800;color:#b09a92}
  .match-box{
    margin-top:22px;padding:16px 18px;border-radius:18px;
    background:var(--light);text-align:center;
  }
  .match-fruits{display:flex;justify-content:center;gap:14px;margin-top:6px}
  .match-fruit{
    background:#fff;border-radius:14px;padding:8px 14px;
    font-size:14px;font-weight:800;
    box-shadow:0 6px 16px -8px rgba(0,0,0,.15);
  }
  .match-fruit .mf{font-size:22px;display:block;margin-bottom:2px}
  .result-actions{margin-top:26px}

  /* 撒花 */
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
  #confetti span{
    position:absolute;left:50%;top:38%;font-size:22px;
    animation:fly 1.3s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes fly{
    0%{transform:translate(-50%,-50%) scale(.4) rotate(0);opacity:1}
    100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.25) rotate(380deg);opacity:0}
  }
  /* 提示 toast */
  .toast{
    position:fixed;left:50%;bottom:48px;transform:translate(-50%,20px);
    background:rgba(60,40,45,.92);color:#fff;font-size:14px;font-weight:700;
    padding:12px 22px;border-radius:999px;opacity:0;z-index:60;
    transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
  <div class="bg-decor"></div>
  <div id="confetti"></div>

  <main class="app">
    <div class="brand">🍓 水果人格研究所 · FUN TEST</div>

    <!-- 开始页 -->
    <section id="screen-start" class="screen active">
      <div class="card">
        <div class="hero-fruits">
          <span>🍓</span><span>🍋</span><span>🍇</span><span>🫐</span>
          <span>🥭</span><span>🍑</span><span>🍌</span><span>🍉</span>
        </div>
        <h1 class="start-title">你是哪种<br>水果人格？</h1>
        <p class="start-sub">
          <b>12 道小题 · 约 1 分钟</b><br>
          没有对错，凭第一直觉选就好<br>
          看看你的灵魂，究竟是哪一颗水果～
        </p>
        <button class="btn" id="startBtn">开始测试 🍹</button>
      </div>
      <p class="footnote">本测试纯属娱乐 · 祝你今天甜甜的</p>
    </section>

    <!-- 答题页 -->
    <section id="screen-quiz" class="screen">
      <div class="card">
        <div class="topbar">
          <button class="back" id="backBtn">← 上一题</button>
          <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
        </div>
        <div class="counter" id="counter"></div>
        <h2 class="question" id="questionText"></h2>
        <div class="options" id="optionsWrap"></div>
      </div>
    </section>

    <!-- 结果页 -->
    <section id="screen-result" class="screen">
      <div class="card">
        <div class="result-head">
          <div class="fruit-big" id="rEmoji"></div>
          <div class="r-tag">你的水果人格是</div>
          <div class="r-name" id="rName"></div>
          <div class="r-title" id="rTitle"></div>
          <div class="r-fit" id="rFit"></div>
        </div>
        <div class="chips" id="rTraits"></div>
        <p class="r-desc" id="rDesc"></p>

        <div class="compose">
          <h4>🍹 你的性格成分 TOP3</h4>
          <div id="rBars"></div>
        </div>

        <div class="match-box">
          <h4>💞 和你天生最搭的水果</h4>
          <div class="match-fruits" id="rMatch"></div>
        </div>

        <div class="result-actions">
          <button class="btn" id="restartBtn">再测一次 ↺</button>
          <button class="btn ghost" id="shareBtn">分享给朋友 📮</button>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

<script>

const MATCH = {
  strawberry:['banana','peach'],
  watermelon:['peach','strawberry'],
  lemon:['blueberry','grape'],
  grape:['blueberry','lemon'],
  blueberry:['lemon','grape'],
  mango:['banana','strawberry'],
  peach:['watermelon','strawberry'],
  banana:['strawberry','mango']
};

const LETTERS = ['A','B','C','D'];
let qi = 0;
let answers = [];

const $ = id => document.getElementById(id);

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

function start(){
  qi = 0;
  answers = [];
  showScreen('screen-quiz');
  renderQuestion();
}

function renderQuestion(){
  const q = QUESTIONS[qi];
  $('counter').textContent = String(qi+1).padStart(2,'0') + ' / ' + String(QUESTIONS.length).padStart(2,'0');
  $('questionText').textContent = q.q;
  $('progressFill').style.width = (qi / QUESTIONS.length * 100) + '%';
  $('backBtn').hidden = qi === 0;

  const wrap = $('optionsWrap');
  wrap.classList.remove('locked');
  wrap.innerHTML = '';
  q.opts.forEach((o,i)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.style.animationDelay = (i*70) + 'ms';
    btn.innerHTML = '<span class="badge">'+LETTERS[i]+'</span><span>'+o.t+'</span>';
    btn.addEventListener('click',()=>choose(o.f,btn));
    wrap.appendChild(btn);
  });
}

function choose(fruit, el){
  answers[qi] = fruit;
  $('progressFill').style.width = ((qi+1) / QUESTIONS.length * 100) + '%';
  document.querySelectorAll('.option').forEach(b=>b.classList.remove('picked'));
  el.classList.add('picked');
  $('optionsWrap').classList.add('locked');
  setTimeout(()=>{
    qi++;
    if(qi < QUESTIONS.length){ renderQuestion(); }
    else{ renderResult(); }
  }, 340);
}

function goBack(){
  if(qi > 0){ qi--; renderQuestion(); }
}

function renderResult(){
  // 计分
  const scores = {};
  Object.keys(FRUITS).forEach(k=>scores[k]=0);
  answers.forEach(a=>{ if(a) scores[a]++; });
  const ranked = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  const [topId, topScore] = ranked[0];
  const f = FRUITS[topId];

  // 主题色
  const sec = $('screen-result');
  sec.style.setProperty('--accent', f.theme);
  sec.style.setProperty('--accent2', f.theme2);
  sec.style.setProperty('--light', f.light);

  $('rEmoji').textContent = f.emoji;
  $('rName').textContent = f.name + '人格';
  $('rTitle').textContent = f.title;
  // 契合度按该水果在题库中可被选中的总次数动态归一化（60%~95%）
  const maxPossible = QUESTIONS.reduce((n,qq)=> n + qq.opts.filter(o=>o.f===topId).length, 0);
  const fit = 60 + Math.round((topScore / maxPossible) * 35);
  $('rFit').textContent = '灵魂契合度 ' + fit + '%';

  $('rTraits').innerHTML = f.traits.map(t=>'<span class="chip">'+t+'</span>').join('');
  $('rDesc').textContent = f.desc;

  // TOP3 成分条
  const top3 = ranked.slice(0,3);
  const max = top3[0][1] || 1;
  $('rBars').innerHTML = top3.map(([id,sc])=>{
    const pct = Math.max(sc>0?8:0, sc/max*100);
    return '<div class="bar-row">'
      + '<span class="bar-label">'+FRUITS[id].emoji+' '+FRUITS[id].name+'</span>'
      + '<div class="bar-track"><div class="bar-fill" data-w="'+pct+'"></div></div>'
      + '<span class="bar-val">'+sc+'</span>'
      + '</div>';
  }).join('');
  requestAnimationFrame(()=>{
    document.querySelectorAll('.bar-fill').forEach(b=>{ b.style.width = b.dataset.w + '%'; });
  });

  // 最搭水果
  $('rMatch').innerHTML = MATCH[topId].map(id=>
    '<div class="match-fruit"><span class="mf">'+FRUITS[id].emoji+'</span>'+FRUITS[id].name+'</div>'
  ).join('');

  showScreen('screen-result');
  burst(f.emoji);
}

/* 撒花动画 */
function burst(emoji){
  const layer = $('confetti');
  layer.innerHTML = '';
  const extras = ['✨','🎉','💫','🌟'];
  for(let i=0;i<26;i++){
    const s = document.createElement('span');
    s.textContent = i%3===0 ? emoji : extras[i%extras.length];
    const ang = Math.random()*Math.PI*2;
    const dist = 90 + Math.random()*170;
    s.style.setProperty('--x', Math.cos(ang)*dist + 'px');
    s.style.setProperty('--y', (Math.sin(ang)*dist - 70) + 'px');
    s.style.animationDelay = (Math.random()*0.25) + 's';
    layer.appendChild(s);
  }
  setTimeout(()=>{ layer.innerHTML=''; }, 1800);
}

/* 分享 */
function share(){
  const name = $('rName').textContent;
  const emoji = $('rEmoji').textContent;
  const text = '我的水果人格是「'+emoji+' '+name+'」！8道题测出你的灵魂水果，你也来玩玩吧～';
  const url = location.href;
  if(navigator.share){
    navigator.share({title:'水果人格测试', text, url}).catch(()=>{});
  }else{
    const full = text + ' ' + url;
    const done = ()=>showToast('结果已复制，快去发给朋友吧 📮');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(full).then(done).catch(()=>fallbackCopy(full,done));
    }else{
      fallbackCopy(full,done);
    }
  }
}
function fallbackCopy(text,cb){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');cb();}catch(e){showToast('复制失败，请截图分享哦');}
  document.body.removeChild(ta);
}
let toastTimer;
function showToast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

/* 背景漂浮水果 */
(function decor(){
  const EMOJIS=['🍓','🍋','🍇','🫐','🥭','🍑','🍌','🍉'];
  const box=document.querySelector('.bg-decor');
  for(let i=0;i<14;i++){
    const s=document.createElement('span');
    s.textContent=EMOJIS[i%EMOJIS.length];
    s.style.left=Math.random()*100+'vw';
    s.style.top=Math.random()*100+'vh';
    s.style.fontSize=(20+Math.random()*34)+'px';
    s.style.animationDelay=(-Math.random()*8)+'s';
    s.style.animationDuration=(7+Math.random()*8)+'s';
    box.appendChild(s);
  }
})();

$('startBtn').addEventListener('click',start);
$('restartBtn').addEventListener('click',()=>showScreen('screen-start'));
$('backBtn').addEventListener('click',goBack);
$('shareBtn').addEventListener('click',share);
</script>
</body>
</html>
